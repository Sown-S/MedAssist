# CI MedAssist: chạy test mỗi khi mở / cập nhật PR vào develop hoặc main, và khi push lên develop.
# Không cần secret: mật khẩu dưới đây chỉ dùng cho PostgreSQL tạm trong máy CI, chạy xong là xóa.
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop]

concurrency:                       # PR đẩy commit mới thì hủy lần chạy cũ
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Tiêu đề PR đúng quy ước
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Tiêu đề: $TITLE"
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|data|docs|test|refactor|perf|build|ci|chore|revert|release)(\([a-z0-9_-]+\))?!?: .+'; then
            echo "::error::Tiêu đề PR phải dạng 'loại(phạm-vi): mô tả', vd 'feat(server): API lịch sử khám'. Xem CONTRIBUTING.md"
            exit 1
          fi

  server:
    name: Server (pytest + Alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: medassist
      MEDASSIST_OWNER_PASSWORD: ci_owner_pw
      MEDASSIST_APP_PASSWORD: ci_app_pw
      MEDASSIST_BACKUP_PASSWORD: ci_backup_pw
      MEDASSIST_CREATE_TEST_DB: "1"
      MEDASSIST_INITDB_SQL: server/db/initdb/sql/01_roles.sql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Cài thư viện
        run: pip install -r server/requirements-dev.txt

      - name: Ruff (lint + định dạng, cấu hình ở ruff.toml)
        run: |
          ruff check server
          ruff format --check server

      - name: Tạo vai trò và database medassist_test (giống Docker initdb)
        run: bash server/db/initdb/01_roles.sh

      - name: Tạo server/.env cho CI
        working-directory: server
        run: |
          cat > .env <<ENV
          ENVIRONMENT=dev
          DATABASE_URL=postgresql+psycopg://medassist_app:ci_app_pw@localhost:5432/medassist
          MIGRATION_DATABASE_URL=postgresql+psycopg://medassist_owner:ci_owner_pw@localhost:5432/medassist
          JWT_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789
          ENV

      - name: Alembic dựng lược đồ và khớp ORM
        working-directory: server
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Hợp đồng với client (schema OpenAPI khớp client/tests/contract/openapi.json)
        working-directory: server
        run: python ../client/scripts/contract/export_openapi.py --check

      - name: Pytest (tự dựng lại medassist_test bằng Alembic)
        working-directory: server
        run: python -m pytest --cov=app --cov=scripts --cov-report=term --cov-fail-under=90

  tools:
    name: tools/drug_data (không cần DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            tools/drug_data/requirements.txt
            tools/hospital_data/requirements.txt
      - run: pip install -r tools/drug_data/requirements.txt -r tools/hospital_data/requirements.txt ruff==0.17.2
      - name: Ruff (lint + định dạng, cấu hình ở ruff.toml)
        run: |
          ruff check tools
          ruff format --check tools
      - working-directory: tools
        run: python -m pytest

  client:
    name: Client (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Cài thư viện (không tải Electron, test không cần)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: ESLint + Stylelint (lỗi hoặc cảnh báo đều chặn PR)
        run: npm run lint
      - name: Vitest
        run: npm test
      - name: Build danh mục component (Ladle) — truyện phải dựng được
        run: npm run ladle:build
      - name: npm audit (thư viện chạy trong app, mức high trở lên chặn PR)
        run: npm audit --omit=dev --audit-level=high
      # Smoke: build bản eval, mở Electron thật (màn hình ảo xvfb), kiểm tra màn khởi động và màn đăng nhập
      # vẽ ra kín cửa sổ, không trắng. Bắt lỗi CSS/JS chỉ lộ trên Chromium của Electron mà vitest (jsdom) không thấy.
      - name: Tải Electron cho smoke
        run: node node_modules/electron/install.js
      - name: Smoke Electron (khởi động + đăng nhập)
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run smoke
      - name: Lưu ảnh chụp smoke khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-screenshots
          path: client/out/smoke/
          if-no-files-found: ignore

  e2e:
    name: Client e2e (Electron + máy chủ thật)
    runs-on: ubuntu-latest
    needs: [client]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: medassist
      MEDASSIST_OWNER_PASSWORD: ci_owner_pw
      MEDASSIST_APP_PASSWORD: ci_app_pw
      MEDASSIST_BACKUP_PASSWORD: ci_backup_pw
      MEDASSIST_INITDB_SQL: server/db/initdb/sql/01_roles.sql
      EVAL_PASSWORD: Kiemthu@2026
      E2E_PASSWORD: Kiemthu@2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Vai trò CSDL, lược đồ và dữ liệu kiểm thử (seed_eval, LLM tắt)
        run: |
          bash server/db/initdb/01_roles.sh
          cd server
          cat > .env <<ENV
          ENVIRONMENT=dev
          DATABASE_URL=postgresql+psycopg://medassist_app:ci_app_pw@localhost:5432/medassist
          MIGRATION_DATABASE_URL=postgresql+psycopg://medassist_owner:ci_owner_pw@localhost:5432/medassist
          JWT_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789
          CORS_ORIGINS=["app://medassist","http://localhost:5173"]
          ENV
          python -m alembic upgrade head
          LLM_PROVIDER=none python -m scripts.seed_eval --knowledge-dir ../knowledge
      - name: Bật API và worker (LLM giả lập)
        working-directory: server
        run: |
          LLM_PROVIDER=fake nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          LLM_PROVIDER=fake nohup python -m app.worker > /tmp/worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Cài thư viện client và Electron
        working-directory: client
        run: |
          npm ci
          node node_modules/electron/install.js
      - name: Playwright trên Electron (màn hình ảo)
        working-directory: client
        run: xvfb-run -a -s "-screen 0 1400x900x24" npm run e2e
      - name: Lưu báo cáo và log khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-e2e
          path: |
            client/out/e2e-report/
            client/out/e2e-results/
            /tmp/api.log
            /tmp/worker.log
          if-no-files-found: ignore
