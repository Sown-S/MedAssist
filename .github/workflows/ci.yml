# CI MedAssist: chạy test mỗi khi mở / cập nhật PR vào develop hoặc main, và khi push lên develop.
# Không cần secret: mật khẩu dưới đây chỉ dùng cho PostgreSQL tạm trong máy CI, chạy xong là xóa.
name: CI

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [develop]

concurrency:                       # PR đẩy commit mới thì hủy lần chạy cũ
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Tiêu đề PR đúng quy ước
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Tiêu đề: $TITLE"
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|data|docs|test|refactor|perf|build|ci|chore|revert|release)(\([a-z0-9_-]+\))?!?: .+'; then
            echo "::error::Tiêu đề PR phải dạng 'loại(phạm-vi): mô tả', vd 'feat(server): API lịch sử khám'. Xem CONTRIBUTING.md"
            exit 1
          fi

  server:
    name: Server (pytest + Alembic)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: medassist
      MEDASSIST_OWNER_PASSWORD: ci_owner_pw
      MEDASSIST_APP_PASSWORD: ci_app_pw
      MEDASSIST_BACKUP_PASSWORD: ci_backup_pw
      MEDASSIST_CREATE_TEST_DB: "1"
      MEDASSIST_INITDB_SQL: server/db/initdb/sql/01_roles.sql
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Cài thư viện
        run: pip install -r server/requirements.txt pytest-cov

      - name: Tạo vai trò và database medassist_test (giống Docker initdb)
        run: bash server/db/initdb/01_roles.sh

      - name: Tạo server/.env cho CI
        working-directory: server
        run: |
          cat > .env <<ENV
          ENVIRONMENT=dev
          DATABASE_URL=postgresql+psycopg://medassist_app:ci_app_pw@localhost:5432/medassist
          MIGRATION_DATABASE_URL=postgresql+psycopg://medassist_owner:ci_owner_pw@localhost:5432/medassist
          JWT_SECRET_KEY=ci-only-secret-key-not-used-anywhere-else-0123456789
          ENV

      - name: Alembic dựng lược đồ và khớp ORM
        working-directory: server
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Pytest (tự dựng lại medassist_test bằng Alembic)
        working-directory: server
        run: python -m pytest --cov=app --cov=scripts --cov-report=term --cov-fail-under=90

  tools:
    name: tools/drug_data (không cần DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/drug_data/requirements.txt
      - run: pip install -r tools/drug_data/requirements.txt
      - working-directory: tools
        run: python -m pytest
