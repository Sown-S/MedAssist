# Phát hành bản cài kiểm thử: đẩy tag vX.Y.Z (trùng "version" trong client/package.json) thì GitHub tự build
# bản cài Windows (.exe) và macOS (.dmg, chip Apple và Intel), rồi tạo Release kèm các file đó.
#   git tag v0.2.0 && git push origin v0.2.0
# Chạy tay (Actions › Release › Run workflow) chỉ build và giữ file ở mục Artifacts, không tạo Release.
# Bản cài nối http://127.0.0.1:8000 (deploy/docker-compose.eval.yml), chưa ký số; xem docs/huong-dan-kiem-thu.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]       # tag sprint dạng v0.N-sprintN không kích hoạt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Bản cài ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: --win, files: "client/dist/*.exe" }
          - { name: macOS, os: macos-latest, target: --mac, files: "client/dist/*.dmg" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Kiểm tra tag khớp version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$want" ] || { echo "::error::Tag $GITHUB_REF_NAME khác version $want trong client/package.json"; exit 1; }

      - run: npm ci

      - name: Build giao diện (chế độ eval)
        run: npx electron-vite build --mode eval

      - name: Đóng gói
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: medassist-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Tạo Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tạo Release và đính kèm bản cài
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "MedAssist $GITHUB_REF_NAME" --notes "Bản cài kiểm thử MedAssist $GITHUB_REF_NAME.

          - Windows: MedAssist-Setup-*.exe
          - macOS: MedAssist-*-arm64.dmg (chip Apple) hoặc MedAssist-*-x64.dmg (chip Intel)

          Bản cài chỉ là ứng dụng desktop; máy chủ chạy bằng Docker. Làm theo docs/huong-dan-kiem-thu.md trong mã nguồn của bản phát hành này."
