# Cập nhật thư viện của client (client/README.md §12). Gộp các bản vá nhỏ thành một PR mỗi tháng để không làm ồn;
# bản lớn (major) từng PR riêng. Chỉ đọc từ nhánh mặc định của repo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(client)"
    groups:
      client-minor-patch:
        update-types: [minor, patch]
