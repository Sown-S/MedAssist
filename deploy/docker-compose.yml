# Máy admin phòng khám: caddy (HTTPS trong LAN) → api; worker AI; db; ollama. Chỉ Caddy mở cổng ra LAN.
# Chạy từ thư mục gốc repo:  .\deploy\scripts\start.ps1   (máy không có GPU NVIDIA: start.ps1 -Cpu)
name: medassist

x-server-env: &server-env
  ENVIRONMENT: prod
  TZ: Asia/Ho_Chi_Minh
  DATABASE_URL: postgresql+psycopg://medassist_app:${MEDASSIST_APP_PASSWORD:?}@db:5432/medassist
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Thiếu JWT_SECRET_KEY trong deploy/.env}
  CORS_ORIGINS: '${CORS_ORIGINS:-["app://medassist"]}'
  TRUSTED_PROXIES: '["172.28.0.2/32"]'
  LLM_PROVIDER: ollama
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:?Thiếu OLLAMA_MODEL trong deploy/.env}
  OLLAMA_KEEP_ALIVE: 24h            # worker gửi kèm mỗi request: giữ model trong VRAM

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong deploy/.env}
      POSTGRES_DB: medassist
      # ICU vi-VN: sắp xếp đúng Anh < Ánh < Ân < Bình < Dương < Đặng (ERD v1.8 mục 1)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=vi-VN --locale=C.UTF-8"
      TZ: Asia/Ho_Chi_Minh
      MEDASSIST_OWNER_PASSWORD: ${MEDASSIST_OWNER_PASSWORD:?}
      MEDASSIST_APP_PASSWORD: ${MEDASSIST_APP_PASSWORD:?}
      MEDASSIST_BACKUP_PASSWORD: ${MEDASSIST_BACKUP_PASSWORD:?}
    volumes:
      - ../server/db/initdb:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medassist"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ../server
    image: medassist-server:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *server-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://medassist_owner:${MEDASSIST_OWNER_PASSWORD:?}@db:5432/medassist
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    restart: "no"

  api:
    build: ../server
    image: medassist-server:local
    restart: unless-stopped
    environment: *server-env
    volumes:
      - ../knowledge:/knowledge:ro    # cho scripts.import_okf (đường dẫn mặc định /knowledge)
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    build: ../server
    image: medassist-server:local
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *server-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      ollama: {condition: service_started}
    networks: [internal]

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.4}   # bản Huy đã chạy thử; cần >= 0.5 cho JSON schema và hf.co/
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h          # giữ model nạp sẵn, tránh trễ lần gọi đầu
      OLLAMA_NUM_PARALLEL: "1"        # hàng đợi LLM mặc định 1 ca
      OLLAMA_CONTEXT_LENGTH: "4096"   # prompt + JSON ~2.200 token; 8192 tốn thêm ~1.5 GB VRAM cho KV cache
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - caddy_data:/data
    depends_on:
      api: {condition: service_healthy}
    networks:
      internal:
        ipv4_address: 172.28.0.2

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # IP động lấy từ .128 trở lên để không chiếm 172.28.0.2 cố định của caddy (TRUSTED_PROXIES).
          ip_range: 172.28.0.128/25

volumes:
  pgdata:
  ollama_models:
  caddy_data:
