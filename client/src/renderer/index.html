<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>MedAssist</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; script-src 'self'; connect-src 'self' http: https:" />
    <style>
      /* Màn khởi động tĩnh: hiện ngay khi cửa sổ mở, trước khi React tải xong (BootGate vẽ lại đúng hình này). */
      html,body{margin:0;background:#F0F2F5}
      .boot{position:fixed;inset:0;display:grid;place-items:center;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#3C434D;background:radial-gradient(900px 520px at 50% 38%,#FFFFFF 0%,#EEF4FE 55%,#E6ECF4 100%);overflow:hidden}
      .boot::before,.boot::after{content:'';position:absolute;border-radius:50%;filter:blur(2px);opacity:.55;pointer-events:none}
      .boot::before{width:520px;height:520px;left:-160px;bottom:-220px;background:radial-gradient(circle,#D7E7FD,transparent 70%)}
      .boot::after{width:420px;height:420px;right:-120px;top:-160px;background:radial-gradient(circle,#E3F6EC,transparent 70%)}
      .boot-card{position:relative;z-index:1;width:min(440px,calc(100vw - 48px));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:bootin .5s cubic-bezier(.2,.7,.2,1) both}
      .boot-mark{width:92px;height:92px;border-radius:26px;display:grid;place-items:center;background:#fff;box-shadow:0 18px 40px -18px rgba(24,119,242,.45),0 0 0 1px rgba(24,119,242,.08);margin-bottom:6px}
      .boot-mark svg{width:62px;height:38px;color:#1877F2;overflow:visible}
      .boot-mark path{stroke-dasharray:100;stroke-dashoffset:100;animation:bootdraw 1.8s cubic-bezier(.6,0,.3,1) infinite}
      .boot-mark circle{animation:bootdot 1.8s ease-in-out infinite}
      .boot-logo{font-size:30px;font-weight:700;color:#16222B;letter-spacing:-.02em;line-height:1}
      .boot-logo b{color:#1877F2;font-weight:700}
      .boot-tag{margin:-4px 0 6px;font-size:14px;color:#5F6E7A}
      .boot-bar{position:relative;width:180px;height:4px;border-radius:4px;background:#DCE3EB;overflow:hidden}
      .boot-bar i{position:absolute;top:0;bottom:0;width:40%;border-radius:4px;background:linear-gradient(90deg,#5AA2FF,#1877F2);animation:bootbar 1.2s cubic-bezier(.2,.7,.2,1) infinite}
      .boot-msg{font-size:13px;color:#5F6E7A;min-height:18px}
      .boot-foot{position:absolute;left:0;right:0;bottom:22px;z-index:1;text-align:center;font-size:12px;color:#8796A5}
      @keyframes bootbar{0%{left:-40%}100%{left:100%}}
      @keyframes bootdraw{0%{stroke-dashoffset:100}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      @keyframes bootdot{0%,45%{transform:scale(0);transform-origin:33px 22px}60%{transform:scale(1.4);transform-origin:33px 22px}75%,100%{transform:scale(1);transform-origin:33px 22px}}
      @keyframes bootin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.boot-bar i,.boot-mark path,.boot-mark circle,.boot-card{animation:none}.boot-mark path{stroke-dashoffset:0}.boot-bar i{left:0;width:100%;opacity:.5}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-card">
          <div class="boot-mark">
            <svg viewBox="5 11 31 19" aria-hidden="true"><path pathLength="100" d="M7 22h5l3-9 5 15 4-11 2.5 5H33" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="33" cy="22" r="1.8" fill="currentColor" /></svg>
          </div>
          <div class="boot-logo">Med<b>Assist</b></div>
          <p class="boot-tag">Hỗ trợ khám ngoại trú cho phòng khám</p>
          <div class="boot-bar"><i></i></div>
          <div class="boot-msg">Đang khởi động…</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
