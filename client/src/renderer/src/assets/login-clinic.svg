<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 440" width="330" height="440">
  <!-- Minh hoạ phòng khám (vẽ riêng cho MedAssist, dạng vector nên luôn nét ở mọi cỡ màn hình). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9E9FF"/>
      <stop offset="1" stop-color="#F4F8FE"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5FB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#CFE3FF"/>
      <stop offset="1" stop-color="#A9CBFA"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1877F2" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="330" height="440" fill="url(#sky)"/>

  <!-- vòng trang trí -->
  <circle cx="270" cy="70" r="70" fill="#FFFFFF" opacity=".55"/>
  <circle cx="40" cy="250" r="54" fill="#FFFFFF" opacity=".45"/>

  <!-- nhịp tim -->
  <path d="M0 104h70l10-18 14 40 16-58 13 46 9-10h198" fill="none" stroke="#1877F2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".22"/>

  <g transform="translate(20 0)">
  <!-- mặt đất -->
  <ellipse cx="165" cy="372" rx="150" ry="16" fill="#C7DAF6"/>

  <!-- cây hai bên -->
  <rect x="52" y="318" width="6" height="44" rx="3" fill="#8A6A4F"/>
  <circle cx="55" cy="312" r="24" fill="#6CCB9A"/>
  <circle cx="42" cy="326" r="15" fill="#52B784"/>
  <rect x="272" y="330" width="6" height="34" rx="3" fill="#8A6A4F"/>
  <circle cx="275" cy="324" r="19" fill="#6CCB9A"/>
  <circle cx="288" cy="334" r="12" fill="#52B784"/>

  <!-- toà nhà -->
  <g filter="url(#sh)">
    <rect x="78" y="196" width="174" height="170" rx="12" fill="url(#wall)"/>
    <rect x="68" y="180" width="194" height="26" rx="9" fill="#1877F2"/>
  </g>

  <!-- biển chữ thập -->
  <rect x="160" y="160" width="10" height="22" fill="#1877F2"/>
  <g filter="url(#sh)">
    <rect x="133" y="104" width="64" height="64" rx="18" fill="#FFFFFF"/>
  </g>
  <path d="M158 118h14v14h14v14h-14v14h-14v-14h-14v-14h14z" fill="#F02849"/>

  <!-- cửa sổ -->
  <g fill="url(#glass)">
    <rect x="94" y="222" width="38" height="30" rx="6"/>
    <rect x="146" y="222" width="38" height="30" rx="6"/>
    <rect x="198" y="222" width="38" height="30" rx="6"/>
    <rect x="94" y="266" width="38" height="30" rx="6"/>
    <rect x="198" y="266" width="38" height="30" rx="6"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="2" opacity=".85">
    <path d="M113 222v30M165 222v30M217 222v30M113 266v30M217 266v30"/>
  </g>
  <!-- ô cửa giữa: biển "phòng khám" -->
  <rect x="146" y="266" width="38" height="30" rx="6" fill="#E7F0FD"/>
  <path d="M153 281h6l3-6 4 12 4-9 2 3h5" fill="none" stroke="#1877F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- cửa ra vào -->
  <rect x="136" y="312" width="58" height="54" rx="7" fill="#1877F2"/>
  <rect x="142" y="318" width="21" height="48" rx="3" fill="#5AA2FF" opacity=".55"/>
  <rect x="167" y="318" width="21" height="48" rx="3" fill="#5AA2FF" opacity=".55"/>
  <rect x="124" y="364" width="82" height="6" rx="3" fill="#B3CBEE"/>

  </g>

  <!-- viên thuốc -->
  <g transform="translate(26 40) rotate(-35 268 230)">
    <rect x="244" y="218" width="48" height="22" rx="11" fill="#FFFFFF"/>
    <path d="M268 218h13a11 11 0 0 1 0 22h-13z" fill="#FFC93C"/>
    <rect x="244" y="218" width="48" height="22" rx="11" fill="none" stroke="#E2B13A" stroke-width="1.5" opacity=".6"/>
  </g>

</svg>
